<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Admin Security Dashboard</title>
  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; user-select: none; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #111827; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; }
    .badge { background: #1e293b; color: #38bdf8; padding: 6px 12px; border-radius: 20px; font-weight: bold; }
    
    .container { display: flex; gap: 20px; }
    .panel { background: #111827; padding: 20px; border-radius: 10px; flex: 1; border: 1px solid #1f2937; }
    
    .action-bar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
    
    .pc-item { background: #1f2937; padding: 10px 15px; margin: 8px 0; border-radius: 6px; display: flex; align-items: center; gap: 10px; }
    
    .app-item { 
      background: #1e293b; 
      padding: 10px 12px; 
      margin: 5px 0; 
      border-radius: 6px; 
      font-size: 14px; 
      color: #a7f3d0; 
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .app-item:hover { background: #334155; }
    .app-item.selected { 
      background: #0284c7; 
      color: #ffffff; 
      border-color: #38bdf8;
      font-weight: bold;
    }

    .btn-toggle { background: #ef4444; color: #fff; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; font-size: 16px; }
    .btn-toggle.active { background: #10b981; }
    
    input[type="file"] { display: none; }
    .btn-action { background: #3b82f6; color: white; padding: 8px 14px; border-radius: 6px; cursor: pointer; border: none; font-size: 13px; font-weight: 600; display: inline-block; }
    .btn-action:hover { opacity: 0.9; }
    .btn-danger { background: #dc2626; }
    .btn-secondary { background: #475569; }
  </style>
</head>
<body>

  <div class="header">
    <h2>PC Security Center</h2>
    <div id="connection-badge" class="badge">Đã kết nối: 0 máy PC</div>
  </div>

  <div class="container">
    <!-- Bảng danh sách máy PC -->
    <div class="panel">
      <h3>💻 Danh Sách Máy PC</h3>
      <div class="action-bar">
        <button class="btn-action btn-secondary" onclick="toggleSelectAllPCs()">☑️ Chọn / Bỏ Tất Cả Máy</button>
      </div>
      <div id="pc-list">
        <p style="color: #6b7280;">Chưa có máy PC nào kết nối...</p>
      </div>
    </div>

    <!-- Bảng quản lý App bị chặn -->
    <div class="panel">
      <h3>📁 Quản Lý App Bị Chặn</h3>
      <div class="action-bar">
        <label class="btn-action">
          ➕ Chọn File (.exe)
          <input type="file" id="file-input" multiple onchange="handleFileSelect(event)">
        </label>
        <button class="btn-action btn-secondary" onclick="toggleSelectAllApps()">☑️ Chọn Tất Cả App</button>
        <button class="btn-action btn-danger" onclick="deleteSelectedApps()">🗑️ Xóa Đã Chọn (Delete)</button>
      </div>

      <div id="app-list" style="margin-top: 10px; max-height: 350px; overflow-y: auto;">
        <!-- Danh sách app sẽ hiện ở đây -->
      </div>

      <button id="btn-protect" class="btn-toggle" onclick="toggleProtection()">
        🛡️ BẬT BẢO VỆ CHO MÁY ĐÃ CHỌN
      </button>
    </div>
  </div>

  <script>
    // 1. Khởi tạo Firebase
    var firebaseConfig = {
      databaseURL: "https://manager-apps-13418-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    var db = firebase.database();

    var blockedAppsList = [];
    var selectedAppIndexes = [];
    var lastSelectedIndex = -1;
    var isProtectionOn = false;
    var allPCsSelected = true;

    // 2. Load danh sách App đã lưu local
    window.onload = function() {
      var saved = localStorage.getItem("saved_apps");
      if (saved) {
        blockedAppsList = JSON.parse(saved);
        renderAppList();
      }
    };

    // 3. ĐỌC VÀ LƯU TRẠNG THÁI NÚT BẢO VỆ TỪ FIREBASE TỰ ĐỘNG
    db.ref("commands").on("value", function(snapshot) {
      var data = snapshot.val();
      var btn = document.getElementById("btn-protect");

      if (data && data.status === "ON") {
        isProtectionOn = true;
        btn.classList.add("active");
        btn.innerText = "🛡️ ĐÃ BẬT BẢO VỆ (BẤM ĐỂ TẮT)";
      } else {
        isProtectionOn = false;
        btn.classList.remove("active");
        btn.innerText = "🛡️ BẬT BẢO VỆ CHO MÁY ĐÃ CHỌN";
      }
    });

    // 4. Đọc danh sách máy PC Online
    db.ref("pcs").on("value", function(snapshot) {
      var pcs = snapshot.val();
      var pcListDiv = document.getElementById("pc-list");
      var badge = document.getElementById("connection-badge");

      if (!pcs) {
        pcListDiv.innerHTML = '<p style="color: #6b7280;">Chưa có máy PC nào kết nối...</p>';
        badge.innerText = "Đã kết nối: 0 máy PC";
        return;
      }

      var keys = Object.keys(pcs);
      badge.innerText = "Đã kết nối: " + keys.length + " máy PC";

      var html = "";
      for (var i = 0; i < keys.length; i++) {
        var pcName = keys[i];
        var checkedAttr = allPCsSelected ? 'checked' : '';
        html += '<div class="pc-item"><input type="checkbox" class="pc-checkbox" ' + checkedAttr + ' value="' + pcName + '"> <b>' + pcName + '</b></div>';
      }
      pcListDiv.innerHTML = html;
    });

    function toggleSelectAllPCs() {
      allPCsSelected = !allPCsSelected;
      var checkboxes = document.querySelectorAll('.pc-checkbox');
      checkboxes.forEach(function(cb) {
        cb.checked = allPCsSelected;
      });
    }

    // 5. Xử lý File và Danh sách App
    function handleFileSelect(event) {
      var files = event.target.files;
      for (var i = 0; i < files.length; i++) {
        var fileName = files[i].name;
        if (blockedAppsList.indexOf(fileName) === -1) {
          blockedAppsList.push(fileName);
        }
      }
      localStorage.setItem("saved_apps", JSON.stringify(blockedAppsList));
      renderAppList();

      if (isProtectionOn) {
        sendFirebaseCommand("ON");
      }
    }

    function renderAppList() {
      var appListDiv = document.getElementById("app-list");
      if (blockedAppsList.length === 0) {
        appListDiv.innerHTML = '<p style="color: #6b7280;">Chưa có app nào trong danh sách.</p>';
        selectedAppIndexes = [];
        return;
      }
      var html = "";
      for (var i = 0; i < blockedAppsList.length; i++) {
        var isSelected = selectedAppIndexes.indexOf(i) !== -1 ? 'selected' : '';
        html += '<div class="app-item ' + isSelected + '" onclick="handleAppClick(event, ' + i + ')">🚫 ' + blockedAppsList[i] + '</div>';
      }
      appListDiv.innerHTML = html;
    }

    function handleAppClick(event, index) {
      if (event.shiftKey && lastSelectedIndex !== -1) {
        var start = Math.min(lastSelectedIndex, index);
        var end = Math.max(lastSelectedIndex, index);
        selectedAppIndexes = [];
        for (var i = start; i <= end; i++) {
          selectedAppIndexes.push(i);
        }
      } else if (event.ctrlKey) {
        var pos = selectedAppIndexes.indexOf(index);
        if (pos === -1) {
          selectedAppIndexes.push(index);
        } else {
          selectedAppIndexes.splice(pos, 1);
        }
        lastSelectedIndex = index;
      } else {
        selectedAppIndexes = [index];
        lastSelectedIndex = index;
      }
      renderAppList();
    }

    function toggleSelectAllApps() {
      if (selectedAppIndexes.length === blockedAppsList.length) {
        selectedAppIndexes = [];
      } else {
        selectedAppIndexes = [];
        for (var i = 0; i < blockedAppsList.length; i++) {
          selectedAppIndexes.push(i);
        }
      }
      renderAppList();
    }

    function deleteSelectedApps() {
      if (selectedAppIndexes.length === 0) return;

      blockedAppsList = blockedAppsList.filter(function(_, idx) {
        return selectedAppIndexes.indexOf(idx) === -1;
      });

      selectedAppIndexes = [];
      lastSelectedIndex = -1;
      localStorage.setItem("saved_apps", JSON.stringify(blockedAppsList));
      renderAppList();

      if (isProtectionOn) {
        sendFirebaseCommand("ON");
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === "Delete" || event.keyCode === 46) {
        deleteSelectedApps();
      }
    });

    // 6. Bật / Tắt Bảo Vệ
    function toggleProtection() {
      if (!isProtectionOn) {
        sendFirebaseCommand("ON");
      } else {
        sendFirebaseCommand("OFF");
      }
    }

    function sendFirebaseCommand(status) {
      db.ref("commands").set({
        status: status,
        blockedApps: status === "ON" ? blockedAppsList : [],
        time: new Date().getTime()
      });
    }
  </script>
</body>
</html>
